name: Validate application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChatPilot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ChatPilot/package-lock.json
      - run: npm ci
      - run: npm exec prisma generate
      - run: npm test -- --runInBand
      - run: npm run build

  whatsapp-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WB
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WB/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand --passWithNoTests
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.trygetchurnshield.com/api/v1
      NEXT_PUBLIC_SITE_URL: https://chatpilot.trygetchurnshield.com
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
